# Push a tag like v1.0.1 → builds the Fedora RPM and attaches it to a GitHub release.
# One matrix job per Fedora release. The asset kcm-cloud-mouse-fcNN-x86_64.rpm has no version in its name, so
# .../releases/latest/download/<name> always points at the newest release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  rpm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43", "44", "45"]   # keep in sync with SUPPORTED_FEDORA in cloud-desktop-host/pve/install.sh
    container: fedora:${{ matrix.fedora }}
    env:
      FEDORA: ${{ matrix.fedora }}
    steps:
      - uses: actions/checkout@v4

      # v1.0.1 → 1.0.1, v2.0.0-rc1 → 2.0.0~rc1 (RPM has no "-" in versions)
      - name: Version
        run: echo "VER=$(echo "${GITHUB_REF_NAME#v}" | tr - '~')" | tee -a "$GITHUB_ENV"

      - name: Build RPM (Fedora ${{ env.FEDORA }})
        run: packaging/build-rpm.sh "$VER"

      - name: Package
        run: |
          mkdir dist && cd dist
          mv "../out/kcm-cloud-mouse-$VER-1.fc$FEDORA.x86_64.rpm" kcm-cloud-mouse-fc$FEDORA-x86_64.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fc${{ matrix.fedora }}
          path: dist/*.rpm
          if-no-files-found: error

  # runs only if every build succeeded: one SHA256SUMS, one release, no partial releases
  release:
    needs: rpm
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rpm-fc*
          merge-multiple: true

      - name: Create release
        run: |
          cd dist
          sha256sum *.rpm > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.rpm SHA256SUMS --generate-notes
